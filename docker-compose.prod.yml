services:
  nginx:
    image: nginx:1.27-alpine
    container_name: game-keys-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html:ro
      - ./frontend/dist:/var/www/frontend:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - reverb
    networks:
      - game-keys

  backend:
    build:
      context: ./docker/php
    container_name: game-keys-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: game_keys
      DB_USERNAME: game_keys
      DB_PASSWORD: game_keys

      REVERB_APP_ID: game-keys
      REVERB_APP_KEY: game-keys
      REVERB_APP_SECRET: game-keys-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080

    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - game-keys

  mysql:
    image: mysql:8.4
    container_name: game-keys-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: game_keys
      MYSQL_USER: game_keys
      MYSQL_PASSWORD: game_keys
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - game-keys

  reverb:
    build:
      context: ./docker/php
    container_name: game-keys-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: game_keys
      DB_USERNAME: game_keys
      DB_PASSWORD: game_keys

      REVERB_APP_ID: game-keys
      REVERB_APP_KEY: game-keys
      REVERB_APP_SECRET: game-keys-secret
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http

      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080

    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - game-keys

  scheduler:
    build:
      context: ./docker/php
    container_name: game-keys-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan schedule:work
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: game_keys
      DB_USERNAME: game_keys
      DB_PASSWORD: game_keys
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - game-keys

  queue:
    build:
      context: ./docker/php
    container_name: game-keys-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work --sleep=1 --tries=3
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: game_keys
      DB_USERNAME: game_keys
      DB_PASSWORD: game_keys
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - game-keys

networks:
  game-keys:
    driver: bridge

volumes:
  mysql_data:

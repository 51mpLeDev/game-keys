services:
  nginx:
    image: nginx:1.27-alpine
    container_name: game-keys-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - game-keys

  backend:
    build:
      context: ./docker/php
    container_name: game-keys-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: game_keys
      DB_USERNAME: game_keys
      DB_PASSWORD: game_keys
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - game-keys

  frontend:
    image: node:22-alpine
    container_name: game-keys-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - game-keys

  mysql:
    image: mysql:8.4
    container_name: game-keys-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: game_keys
      MYSQL_USER: game_keys
      MYSQL_PASSWORD: game_keys
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - game-keys

networks:
  game-keys:
    driver: bridge

volumes:
  mysql_data:
  frontend_node_modules: